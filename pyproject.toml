[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrobridge"
version = "0.1.0"
description = "Conditional Brownian-bridge inverse imaging with reproducible ensemble evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Divyansh Gupta"}]
dependencies = ["torch>=2.2", "numpy>=1.24"]

[project.urls]
Repository = "https://github.com/DIVYANSH-675/AstroBridge"
Issues = "https://github.com/DIVYANSH-675/AstroBridge/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1", "ruff>=0.9"]

[project.scripts]
astrobridge = "astrobridge.cli:main"
astrobridge-artifacts = "astrobridge.artifact_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
